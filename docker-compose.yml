# =============================================================================
# CyberSentinel WAF — Core Services Orchestration (Self-Contained)
# =============================================================================
services:
  # Scoped proxy in front of the host's Docker socket. The backend needs to
  # `docker exec`/`docker restart` the waf-openresty and waf-ml containers
  # (reload config, restart the engine) — previously it did that by mounting
  # /var/run/docker.sock directly, which hands it root-equivalent control of
  # every container AND the host (create/delete containers, mount arbitrary
  # host paths into a new privileged container, read any other container's
  # env vars/secrets, etc.) if the backend is ever compromised via an authz
  # bug. This proxy (github.com/Tecnativa/docker-socket-proxy) sits between
  # the backend and the real socket and only allows the handful of API calls
  # `docker exec`/`docker restart`/`docker --version` actually need —
  # everything else (container create/delete, image pull, volume/network
  # management, exec into arbitrary OTHER containers) is denied at the proxy,
  # not just "not currently used."
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    container_name: waf-docker-socket-proxy
    restart: unless-stopped
    environment:
      # Read-only container listing — needed for the Docker CLI to resolve
      # a container name to an ID before exec/restart.
      CONTAINERS: 1
      # Needed for `docker exec waf-openresty ...` (reload/test nginx config).
      EXEC: 1
      # Needed for `docker restart waf-openresty` / `waf-ml`.
      RESTART: 1
      POST: 1
      # Everything else stays at its default-deny (images, volumes, networks,
      # container create/delete, swarm, secrets, etc. are all off).
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    expose:
      - "2375"
    networks:
      - waf-network

  backend:
    build: ./backend
    container_name: waf-backend
    restart: unless-stopped
    volumes:
      # Local configs & dynamic database mapping
      - ./backend/app/config:/app/app/config
      - ./backend/app/data:/app/app/data
      - ./backend/app/data:/opt/ModSecurity/WAF_GUI/backend/app/data
      # Relocated log dirs for full portability
      - ./logs/modsecurity/audit:/var/log/modsecurity/audit:ro
      - ./configs/nginx:/etc/nginx
      - ./logs/nginx:/var/log/nginx:ro
      # GeoIP2 Databases folder mapping
      - ./backend/app/data:/etc/nginx/geoip:ro
      # Scripts directory mount for migration
      - ./scripts:/app/scripts:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    expose:
      - "8000"
    environment:
      # Points the `docker` CLI (installed in backend/Dockerfile) at the
      # scoped proxy above instead of a raw socket mount.
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      ML_API: http://waf-ml:9000
      REDIS_HOST: waf-redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      GEOIP_DATA_DIR: /etc/nginx/geoip
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS}
      INTERNAL_ALERT_TRIGGER_KEY: ${INTERNAL_ALERT_TRIGGER_KEY}
      CLICKHOUSE_HOST: waf-clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      docker-socket-proxy:
        condition: service_started
      ml-engine:
        condition: service_started
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: ${BACKEND_CPU_LIMIT:-2}
          memory: ${BACKEND_MEM_LIMIT:-1G}
        reservations:
          cpus: ${BACKEND_CPU_RESERVE:-0.5}
          memory: ${BACKEND_MEM_RESERVE:-256M}
    networks:
      - waf-network

  ml-engine:
    build: ./ml-waf
    container_name: waf-ml
    restart: unless-stopped
    expose:
      - "9000"
    volumes:
      - ./ml-waf/models:/app/models
      - ./backend/app/data:/opt/ModSecurity/WAF_GUI/backend/app/data
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      REDIS_HOST: waf-redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      ML_DB_PATH: /opt/ModSecurity/WAF_GUI/backend/app/data/ml_events.db
      CLICKHOUSE_HOST: waf-clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      INTERNAL_ALERT_TRIGGER_KEY: ${INTERNAL_ALERT_TRIGGER_KEY}
      # How often (hours) the in-process drift monitor checks the last 24h
      # of ML telemetry and auto-triggers a retrain if thresholds are
      # breached. Optional — defaults to 6 in ml_server.py if unset.
      DRIFT_CHECK_INTERVAL_HOURS: ${DRIFT_CHECK_INTERVAL_HOURS:-6}

    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: ${ML_CPU_LIMIT:-2}
          memory: ${ML_MEM_LIMIT:-2G}
        reservations:
          cpus: ${ML_CPU_RESERVE:-1}
          memory: ${ML_MEM_RESERVE:-512M}
    networks:
      - waf-network

  clickhouse:
    image: clickhouse/clickhouse-server:24.6-alpine
    container_name: waf-clickhouse
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CLICKHOUSE_HOST_PORT:-8123}:8123"
    expose:
      - "8123"   # HTTP interface (clickhouse-connect)
      - "9000"   # Native TCP interface
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
      - ./configs/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "${CLICKHOUSE_USER}", "--password", "${CLICKHOUSE_PASSWORD}", "--query", "SELECT 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    networks:
      - waf-network

  redis:
    image: redis:7-alpine
    container_name: waf-redis
    restart: unless-stopped
    expose:
      - "6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "PING"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: ${REDIS_CPU_LIMIT:-1}
          memory: ${REDIS_MEM_LIMIT:-512M}
        reservations:
          cpus: ${REDIS_CPU_RESERVE:-0.25}
          memory: ${REDIS_MEM_RESERVE:-128M}
    networks:
      - waf-network

  openresty:
    build: ./openresty
    container_name: waf-openresty
    restart: unless-stopped
    ports:
      # Port 3020 — direct WAF Dashboard access (HTTP, WAF-inspected)
      - "${DASHBOARD_PORT:-3020}:3020"
      # Port 80 — intercepts all plain HTTP, redirects to HTTPS 443
      - "${HTTP_PORT:-80}:80"
      # Port 443 — HTTPS WAF gateway (TLS + ModSecurity + ML-WAF)
      - "${HTTPS_PORT:-443}:443"
    volumes:
      # Custom Nginx configurations mapped to internal config paths
      - ./configs/nginx:/etc/nginx
      - ./logs/modsecurity:/var/log/modsecurity
      - ./logs/nginx:/var/log/nginx
      - ./ml-waf:/opt/ml-waf:ro
      # GeoIP2 databases folder mapped inside OpenResty
      - ./backend/app/data:/etc/nginx/geoip:ro
      # Let's Encrypt: certbot writes challenges here; nginx reads them for HTTP-01 validation
      - ./configs/acme-challenge:/etc/nginx/acme-challenge
      # Let's Encrypt: issued certs are stored here (certbot + nginx both read from this path)
      - ./configs/nginx/ssl/letsencrypt:/etc/nginx/ssl/letsencrypt
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      ML_HOST: waf-ml
      ML_PORT: 9000
    depends_on:
      backend:
        condition: service_healthy
      ml-engine:
        condition: service_healthy
      redis:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3020/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    deploy:
      resources:
        limits:
          cpus: ${OPENRESTY_CPU_LIMIT:-2}
          memory: ${OPENRESTY_MEM_LIMIT:-1G}
        reservations:
          cpus: ${OPENRESTY_CPU_RESERVE:-0.5}
          memory: ${OPENRESTY_MEM_RESERVE:-256M}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - waf-network

  frontend:
    build: ./frontend
    container_name: waf-frontend
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: ${FRONTEND_CPU_LIMIT:-0.5}
          memory: ${FRONTEND_MEM_LIMIT:-256M}
        reservations:
          cpus: ${FRONTEND_CPU_RESERVE:-0.1}
          memory: ${FRONTEND_MEM_RESERVE:-64M}
    networks:
      - waf-network

  certbot:
    image: certbot/certbot:latest
    container_name: waf-certbot
    restart: unless-stopped
    volumes:
      # Shared webroot for HTTP-01 challenge tokens (nginx serves this path on port 80)
      - ./configs/acme-challenge:/acme-challenge
      # Output directory: certbot writes fullchain.pem + privkey.pem here
      - ./configs/nginx/ssl/letsencrypt:/etc/letsencrypt/live
      # Certbot config and work dirs
      - ./configs/certbot/config:/etc/letsencrypt
      - ./configs/certbot/work:/var/lib/letsencrypt
      - ./configs/certbot/logs:/var/log/letsencrypt
      - /etc/localtime:/etc/localtime:ro
    entrypoint: /bin/sh
    command: >
      -c "trap exit TERM;
          while :; do
            certbot renew
              --webroot -w /acme-challenge
              --non-interactive
              --quiet;
            sleep 43200;
          done"
    networks:
      - waf-network

networks:
  waf-network:
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: "172.20.0.0/16"
        - subnet: "fd00::/80"

volumes:
  clickhouse_data:
    driver: local
  clickhouse_logs:
    driver: local
