# =============================================================================
# CyberSentinel WAF — Core Services Orchestration (Self-Contained)
# =============================================================================
services:
  backend:
    build: ./backend
    container_name: waf-backend
    restart: unless-stopped
    volumes:
      # Local configs & dynamic database mapping
      - ./backend/app/config:/app/app/config
      - ./backend/app/data:/app/app/data
      - ./backend/app/data:/opt/ModSecurity/WAF_GUI/backend/app/data
      # Relocated log dirs for full portability
      - ./logs/modsecurity/audit:/var/log/modsecurity/audit:ro
      - ./configs/nginx:/etc/nginx
      - ./logs/nginx:/var/log/nginx:ro
      # GeoIP2 Databases folder mapping
      - ./backend/app/data:/etc/nginx/geoip:ro
      # Docker control interface (for service state discovery)
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    expose:
      - "8000"
    environment:
      ML_API: http://ml-engine:9000
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      GEOIP_DATA_DIR: /etc/nginx/geoip
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      ml-engine:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: ${BACKEND_CPU_LIMIT:-2}
          memory: ${BACKEND_MEM_LIMIT:-1G}
        reservations:
          cpus: ${BACKEND_CPU_RESERVE:-0.5}
          memory: ${BACKEND_MEM_RESERVE:-256M}
    networks:
      - waf-network

  ml-engine:
    build: ./ml-waf
    container_name: waf-ml
    restart: unless-stopped
    expose:
      - "9000"
    volumes:
      - ./ml-waf/models:/app/models
      - ./backend/app/data:/opt/ModSecurity/WAF_GUI/backend/app/data
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: ${ML_CPU_LIMIT:-2}
          memory: ${ML_MEM_LIMIT:-2G}
        reservations:
          cpus: ${ML_CPU_RESERVE:-1}
          memory: ${ML_MEM_RESERVE:-512M}
    networks:
      - waf-network

  redis:
    image: redis:7-alpine
    container_name: waf-redis
    restart: unless-stopped
    expose:
      - "6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: ${REDIS_CPU_LIMIT:-1}
          memory: ${REDIS_MEM_LIMIT:-512M}
        reservations:
          cpus: ${REDIS_CPU_RESERVE:-0.25}
          memory: ${REDIS_MEM_RESERVE:-128M}
    networks:
      - waf-network

  openresty:
    build: ./openresty
    container_name: waf-openresty
    restart: unless-stopped
    ports:
      # Port 3001 — direct WAF Dashboard access (HTTP, WAF-inspected)
      - "3001:3001"
      # Port 80 — intercepts all plain HTTP, redirects to HTTPS 443
      - "80:80"
      # Port 443 — HTTPS WAF gateway (TLS + ModSecurity + ML-WAF)
      - "443:443"
    volumes:
      # Custom Nginx configurations mapped to internal config paths
      - ./configs/nginx:/etc/nginx
      - ./logs/modsecurity:/var/log/modsecurity
      - ./logs/nginx:/var/log/nginx
      - ./ml-waf:/opt/ml-waf:ro
      # GeoIP2 databases folder mapped inside OpenResty
      - ./backend/app/data:/etc/nginx/geoip:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      ML_HOST: ml-engine
      ML_PORT: 9000
    depends_on:
      backend:
        condition: service_healthy
      ml-engine:
        condition: service_healthy
      redis:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    deploy:
      resources:
        limits:
          cpus: ${OPENRESTY_CPU_LIMIT:-2}
          memory: ${OPENRESTY_MEM_LIMIT:-1G}
        reservations:
          cpus: ${OPENRESTY_CPU_RESERVE:-0.5}
          memory: ${OPENRESTY_MEM_RESERVE:-256M}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - waf-network

  frontend:
    build: ./frontend
    container_name: waf-frontend
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: ${FRONTEND_CPU_LIMIT:-0.5}
          memory: ${FRONTEND_MEM_LIMIT:-256M}
        reservations:
          cpus: ${FRONTEND_CPU_RESERVE:-0.1}
          memory: ${FRONTEND_MEM_RESERVE:-64M}
    networks:
      - waf-network

networks:
  waf-network:
    driver: bridge
