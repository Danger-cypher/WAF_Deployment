# Auto-generated by CyberSentinel WAF GUI
# Do not edit manually

geoip2 /etc/nginx/geoip/GeoLite2-Country.mmdb {
    $geoip2_data_country_code source=$remote_addr country iso_code;
}

geoip2 /etc/nginx/geoip/GeoLite2-ASN.mmdb {
    $geoip2_data_asn source=$remote_addr autonomous_system_number;
    $geoip2_data_org source=$remote_addr autonomous_system_organization;
}

# --- Bot Mitigation ---
map $http_user_agent $is_bad_bot {
    default 0;
    "~*semrush" 1;
    "~*ahrefs" 1;
    "~*mj12bot" 1;
    "~*dotbot" 1;
    "~*rogerbot" 1;
    "~*megaindex" 1;
    "~*zoominfobot" 1;
    "~*yandexbot" 1;
    "~*baiduspider" 1;
    "~*screaming frog" 1;
    "~*sqlmap" 1;
    "~*nmap" 1;
    "~*nikto" 1;
    "~*dirbuster" 1;
    "~*censys" 1;
    "~*shodan" 1;
    "~*netsparker" 1;
    "~*acunetix" 1;
    "~*python-requests" 1;
    "~*pycurl" 1;
    "~*urllib" 1;
    "~*wget" 1;
    "-" 1;
    "" 1;
}

map $is_bad_bot $bot_limit_key {
    0 "";
    1 "bad_bot_key";
}

limit_req_zone $bot_limit_key zone=waf_bot_req:10m rate=1r/m;

map $host $limit_key {
    default $binary_remote_addr;
}

limit_req_zone $limit_key zone=waf_ddos_req:10m rate=50r/s;
limit_req_status 444;

limit_req zone=waf_ddos_req burst=100 nodelay;
limit_req zone=waf_bot_req burst=1 nodelay;

map $host $waf_bot_challenge_enabled {
    default 0;
}

map $host $waf_risk_challenge_enabled {
    default 0;
}

limit_conn_zone $limit_key zone=waf_ddos_conn:10m;
limit_conn_status 444;
limit_conn waf_ddos_conn 100;

