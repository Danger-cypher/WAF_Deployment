# Auto-generated by CyberSentinel WAF GUI
# Do not edit manually

geoip2 /etc/nginx/geoip/GeoLite2-Country.mmdb {
    $geoip2_data_country_code source=$remote_addr country iso_code;
}

# --- Bot Mitigation ---
map $http_user_agent $is_bad_bot {
    default 0;
    "~*semrush" 1;
    "~*ahrefs" 1;
    "~*mj12bot" 1;
    "~*dotbot" 1;
    "~*rogerbot" 1;
    "~*megaindex" 1;
    "~*zoominfobot" 1;
    "~*yandexbot" 1;
    "~*baiduspider" 1;
    "~*screaming frog" 1;
    "~*sqlmap" 1;
    "~*nmap" 1;
    "~*nikto" 1;
    "~*dirbuster" 1;
    "~*censys" 1;
    "~*shodan" 1;
    "~*netsparker" 1;
    "~*acunetix" 1;
    "~*python-requests" 1;
    "~*pycurl" 1;
    "~*urllib" 1;
    "~*wget" 1;
    "-" 1;
    "" 1;
}

map $is_bad_bot $bot_limit_key {
    0 "";
    1 "bad_bot_key";
}

limit_req_zone $bot_limit_key zone=waf_bot_req:10m rate=1r/m;

geo $limit {
    default 1;
    10.0.0.1 0;
    192.168.1.0/24 0;
}

map $limit $limit_key {
    0 "";
    1 $binary_remote_addr;
}

limit_req_zone $limit_key zone=waf_ddos_req:10m rate=99r/s;
limit_req_status 444;

limit_req zone=waf_ddos_req burst=204 nodelay;
limit_req zone=waf_bot_req burst=1 nodelay;

limit_conn_zone $limit_key zone=waf_ddos_conn:10m;
limit_conn_status 444;
limit_conn waf_ddos_conn 100;

# --- Advanced Rate Limiting Rules ---
# Rule: Limit per Session Cookie (Type: Session, Limit by unique value of $cookie_sessionid)
map $cookie_sessionid $limit_key_rule_test_api_123 {
    "~.+" $cookie_sessionid;
    default "";
}
limit_req_zone $limit_key_rule_test_api_123 zone=zone_rule_test_api_123:10m rate=10r/s;
limit_req zone=zone_rule_test_api_123 burst=20 nodelay;

