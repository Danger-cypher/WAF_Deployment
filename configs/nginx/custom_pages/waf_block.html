<!DOCTYPE html>
<html>
<head>
<title>403 Forbidden</title>
<style>
body { font-family: sans-serif; text-align: center; padding: 50px; background-color: #f4f4f5; }
h1 { color: #ef4444; }
.incident-id { font-family: monospace; background: #e4e4e7; padding: 5px; border-radius: 4px; }
</style>
</head>
<body>
<h1>Access Denied</h1>
<p>Your request was blocked by the Web Application Firewall due to security policies.</p>
<p>If you believe this is an error, please contact support and provide the following transaction ID:</p>
<p>Transaction ID: <span class="incident-id">{{transaction_id}}</span></p>
</body>
</html>
