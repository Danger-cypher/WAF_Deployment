Include /etc/nginx/modsec/modsecurity.conf
Include /etc/nginx/modsec/coreruleset/crs-setup.conf
Include /etc/nginx/modsec/rules-exclusions-before-crs.conf
# custom-rfi-cmdi.conf (P3-01) must run before coreruleset/rules/*.conf:
# REQUEST-949-BLOCKING-EVALUATION.conf (inside that glob) snapshots
# tx.inbound_anomaly_score_pl1 into tx.blocking_inbound_anomaly_score —
# the exact variable ml_decide.lua reads via $modsecurity_anomaly_score —
# partway through that glob's alphabetical file order. A custom rule
# Included AFTER the glob (as this originally was) still executes and
# still increments tx.inbound_anomaly_score_pl1, but too late: the
# snapshot already happened, so its contribution is silently invisible
# to the Lua blocking decision even though ModSecurity itself "saw" the
# match. Existing CRS rules never hit this because every coreruleset
# file loads together in one glob, in alphabetical order, and REQUEST-
# 949 sorts after REQUEST-941/942/etc.
Include /etc/nginx/modsec/custom-rfi-cmdi.conf
Include /etc/nginx/modsec/coreruleset/rules/*.conf

Include /etc/nginx/modsec/rules-override.conf
Include /etc/nginx/modsec/custom-dlp.conf
Include /etc/nginx/modsec/custom-audit-redaction.conf
Include /etc/nginx/modsec/custom-rules.conf

