# Custom RFI / Command-Substitution Detection (audit finding P3-01)
#
# The shipped OWASP CRS 4.29.0-dev runs at PL1 (rules-override.conf) — a
# deliberately conservative default that keeps the ~150 PL2+ rules (broader
# regexes, more false-positive-prone) off by default. Two real attack
# classes fall through that gap entirely at PL1:
#
#   - Backtick / $(...) command substitution: CRS's own PL1 shell-command
#     rule (932160, REQUEST-932-APPLICATION-ATTACK-RCE.conf) phrase-matches
#     against coreruleset/rules/data/unix-shell.data, which does NOT list
#     bare "id" — so `id` (audit payload ?cmd=`id`) evades it entirely.
#     There's no PL1 rule at all that flags the substitution syntax itself.
#   - RFI to a domain name: CRS's PL1 RFI rule (below, kept as-is) only
#     matches scheme:// followed directly by an IP address; the PL2 rule
#     (931131) is what actually matches scheme://a-domain-name, and PL2 is
#     off here.
#
# Rather than raise the global paranoia level to PL2 — which would turn on
# every other PL2 rule too, each with its own, unreviewed false-positive
# profile, against production traffic for every protected app behind this
# WAF, not just this deployment's own console — this file adds two narrow,
# hand-written rules for exactly these two gaps, deliberately scoped to
# ARGS_GET (query-string parameters) only, not full ARGS (which also covers
# POST bodies): this WAF's own admin API takes rule/regex/config text
# through POST JSON bodies (see custom-rules.conf, rules-exclusions-
# before-crs.conf) where a literal backtick or a documented example URL is
# plausible input; nothing in this product's own routes accepts a URL or
# shell-shaped value via a GET query parameter (checked: no redirect/
# callback/return_to/next-style param exists anywhere in backend/app/routes).
# That leaves real, if smaller, residual exposure for command-substitution
# or scheme:// syntax arriving via POST bodies (customer apps' own forms,
# not this console) — same paranoia-level tradeoff the audit raised,
# narrowed rather than eliminated. Bumping to PL2 (or extending these two
# rules to full ARGS) remains a product decision for whoever owns false-
# positive risk on the protected customer apps, not something to flip
# silently in a security-audit remediation pass.

SecRule ARGS_GET "@rx (`[^`]+`|\$\([^)]+\))" \
    "id:2000020,\
    phase:2,\
    pass,\
    t:none,t:urlDecodeUni,\
    msg:'Custom: Command Substitution Syntax in Query String (backtick or $()) — audit finding P3-01',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'attack-rce',\
    tag:'CyberSentinel/custom',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

SecRule ARGS_GET "@rx (?i)^(?:file|ftps?|https?)://[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)+" \
    "id:2000021,\
    phase:2,\
    pass,\
    t:none,t:urlDecodeUni,\
    msg:'Custom: Possible Remote File Inclusion (RFI) to a Domain in Query String — audit finding P3-01',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'attack-rfi',\
    tag:'CyberSentinel/custom',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"
