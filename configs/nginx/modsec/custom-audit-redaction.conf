# Audit Log Redaction
#
# SecAuditLogRelevantStatus (modsecurity.conf) logs essentially every
# request, including ordinary 2xx responses — and SecAuditLogParts includes
# "I" (the parsed request body). Without this exclusion, every single login
# attempt writes its POST body — username AND password, in cleartext — into
# a JSON file under /var/log/modsecurity/audit/, whether or not anything
# matched. Rule-match evidence (matched substrings, message text) still
# reaches the audit log via part H regardless of this rule, so attack
# detection on these paths is unaffected — only the wholesale raw-body dump
# is suppressed.
SecRule REQUEST_URI "@beginsWith /api/auth/" \
    "id:2000010,\
    phase:1,\
    pass,\
    nolog,\
    t:none,\
    ctl:auditLogParts=-I"
