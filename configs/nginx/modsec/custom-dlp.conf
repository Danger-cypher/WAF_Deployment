# Custom Data Leakage Prevention (DLP) Rules

# Detect Credit Card Number patterns (4 blocks of 4 digits), Luhn-validated.
# Example: 1234-5678-1234-5678 or 1234 5678 1234 5678
# @verifyCC applies the given pattern to find a candidate span, then runs a
# Luhn (mod-10) checksum over its digits before matching — a plain @rx here
# blocked any digit string in this shape (invoice numbers, tracking IDs,
# reference numbers), which is a real false-positive risk on a live-blocking
# rule. luhnVerify() only counts digit characters, so separators (space/dash)
# between groups are handled the same as before; no pattern change needed
# beyond the operator itself.
SecRule RESPONSE_BODY "@verifyCC (?:\d{4}[ -]?){3}\d{4}" \
    "id:2000001,\
    phase:4,\
    block,\
    capture,\
    t:none,\
    msg:'Data Leakage Prevention: Potential Credit Card Number Detected in Response',\
    logdata:'Matched Data: %{TX.0}',\
    severity:'CRITICAL'"

# Detect US Social Security Numbers (###-##-####, dashes optional).
# @verifySSN does real structural validation (rejects invalid area numbers
# like 000/666/900-999, sequential/repeated-digit fakes like 123-45-6789),
# not just a digit-shape regex — same false-positive reasoning as @verifyCC
# above: a plain @rx here would also match plenty of non-SSN 9-digit
# strings (order numbers, phone-adjacent IDs).
SecRule RESPONSE_BODY "@verifySSN \d{3}-?\d{2}-?\d{4}" \
    "id:2000002,\
    phase:4,\
    block,\
    capture,\
    t:none,\
    msg:'Data Leakage Prevention: Potential SSN Detected in Response',\
    logdata:'Matched Data: %{TX.0}',\
    severity:'CRITICAL'"

# Detect leaked AWS access keys and PEM private-key material in responses.
# No ModSecurity built-in operator exists for generic secrets (unlike CC/
# SSN above) — these are plain @rx against known, high-confidence formats
# only. Deliberately NOT attempting generic high-entropy/bearer-token
# detection here: on a live-blocking rule, that's a real false-positive
# risk against legitimately random-looking API responses (session IDs,
# hashes, etc.) — same reasoning that ruled out a plain-regex credit-card
# rule above.
SecRule RESPONSE_BODY "@rx AKIA[0-9A-Z]{16}" \
    "id:2000003,\
    phase:4,\
    block,\
    capture,\
    t:none,\
    msg:'Data Leakage Prevention: Potential AWS Access Key Detected in Response',\
    logdata:'Matched Data: %{TX.0}',\
    severity:'CRITICAL'"

SecRule RESPONSE_BODY "@rx -----BEGIN (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----" \
    "id:2000004,\
    phase:4,\
    block,\
    capture,\
    t:none,\
    msg:'Data Leakage Prevention: Private Key Material Detected in Response',\
    logdata:'Matched Data: %{TX.0}',\
    severity:'CRITICAL'"
