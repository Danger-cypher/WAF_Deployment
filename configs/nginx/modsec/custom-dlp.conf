# Custom Data Leakage Prevention (DLP) Rules

# Detect Credit Card Number patterns (4 blocks of 4 digits), Luhn-validated.
# Example: 1234-5678-1234-5678 or 1234 5678 1234 5678
# @verifyCC applies the given pattern to find a candidate span, then runs a
# Luhn (mod-10) checksum over its digits before matching — a plain @rx here
# blocked any digit string in this shape (invoice numbers, tracking IDs,
# reference numbers), which is a real false-positive risk on a live-blocking
# rule. luhnVerify() only counts digit characters, so separators (space/dash)
# between groups are handled the same as before; no pattern change needed
# beyond the operator itself.
SecRule RESPONSE_BODY "@verifyCC (?:\d{4}[ -]?){3}\d{4}" \
    "id:2000001,\
    phase:4,\
    block,\
    capture,\
    t:none,\
    msg:'Data Leakage Prevention: Potential Credit Card Number Detected in Response',\
    logdata:'Matched Data: %{TX.0}',\
    severity:'CRITICAL'"
