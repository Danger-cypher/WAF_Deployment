# =============================================================================
# OpenResty nginx.conf — CyberSentinel WAF
# HTTP + HTTPS interception with ModSecurity + ML-WAF
# =============================================================================

load_module modules/ngx_http_modsecurity_module.so;
load_module modules/ngx_http_geoip2_module.so;

user www-data;
worker_processes auto;
pid /usr/local/openresty/nginx/logs/nginx.pid;

env REDIS_HOST;
env REDIS_PASSWORD;
env ML_HOST;
env ML_PORT;

error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
    multi_accept on;
    use epoll;
}

http {
    # ── OpenResty Lua ──────────────────────────────────────────────────────────
    lua_package_path  "/usr/local/openresty/lualib/?.lua;/usr/local/openresty/lualib/?/init.lua;;";
    lua_package_cpath "/usr/local/openresty/lualib/?.so;;";

    # ── Basic HTTP Settings ───────────────────────────────────────────────────
    include       mime.types;
    default_type  application/octet-stream;
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    keepalive_requests 1000;
    types_hash_max_size 2048;

    # nginx's default (unset) bucket size is 32 or 64 bytes depending on the
    # CPU's cache line size — a protected app's `domain` can easily exceed
    # that (confirmed live: a 47-char test domain failed config validation
    # entirely with "could not build server_names_hash, you should increase
    # server_names_hash_bucket_size"). Every protected-app config write goes
    # through write_and_apply_configs()'s validate-then-rollback, so this
    # never caused a live outage, but it would silently block onboarding any
    # app with a moderately long domain name. 128 comfortably covers real-
    # world subdomains without meaningfully increasing memory use.
    server_names_hash_bucket_size 128;

    # ── Proxy Performance Settings ────────────────────────────────────────────
    proxy_connect_timeout  10s;
    proxy_send_timeout     60s;
    proxy_read_timeout     60s;
    proxy_buffering        on;
    proxy_buffer_size      8k;
    proxy_buffers          16 8k;
    proxy_busy_buffers_size 16k;

    # ── File Cache (reduces disk I/O for static assets) ───────────────────────
    open_file_cache          max=1000 inactive=20s;
    open_file_cache_valid    30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors   on;

    # Extended log format with real request timing (replaces simulated latency)
    # $request_time = total time from first byte received to last byte sent (seconds)
    # $upstream_response_time = backend response time (-  if no upstream)
    # $scheme / $sent_http_content_encoding feed API Protection's TLS and
    # Compression scoring signals — previously fabricated (has_https was
    # hardcoded true, content_encoding was guessed from the status code)
    # because this data simply wasn't captured. $sent_http_content_encoding
    # is empty (not "-") when no Content-Encoding header was sent, quoted
    # below so an empty value still parses as a clean token.
    log_format waf_extended '$remote_addr - $remote_user [$time_local] '
                             '"$request" $status $body_bytes_sent '
                             '"$http_referer" "$http_user_agent" '
                             '$request_time $upstream_response_time '
                             '$scheme "$sent_http_content_encoding"';

    # Buffered access log — flushes every 10s or 512KB to reduce I/O
    access_log /var/log/nginx/access.log waf_extended buffer=512k flush=10s;

    # ── Gzip ─────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/rss+xml application/atom+xml image/svg+xml;

    # ── Global TLS/SSL Settings ───────────────────────────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256";
    ssl_session_cache shared:SSL:20m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_buffer_size 1400;

    # ── ModSecurity (Global — applies to ALL server blocks) ───────────────────
    modsecurity on;
    modsecurity_rules_file /etc/nginx/modsec/main.conf;

    # ── ML-WAF Engine (Global — applies to ALL server blocks) ─────────────────
    access_by_lua_file /opt/ml-waf/ml_check.lua;

    # ── Variables ─────────────────────────────────────────────────────────────
    geo $bad_client {
        default 0;
    }

    # ── Rate Limit Zones ──────────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api_limit:10m   rate=30r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=ws_conn_limit:10m;

    # ── Security Response Headers (Global) ────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none';" always;

    # ── WAF GUI auto-generated configs ────────────────────────────────────────
    include /etc/nginx/conf.d/*.conf;

    # ── Virtual host configs ──────────────────────────────────────────────────
    include /etc/nginx/sites-enabled/*;
}
