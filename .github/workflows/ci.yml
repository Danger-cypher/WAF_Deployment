name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      # test_rule_canary.py exercises rule_manager.py against real CRS rule
      # IDs (e.g. 901001) parsed from configs/nginx/modsec/coreruleset — a
      # git submodule actions/checkout doesn't fetch by default. Without
      # this, rule_manager falls back to its small hardcoded sample set
      # (which doesn't contain those IDs) and every canary test fails on
      # "Rule ID ... does not exist in the active OWASP CRS dataset."
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Run pytest
        working-directory: backend
        env:
          # Points rule_manager.py at the submodule actions/checkout just
          # fetched (see rule_manager.py's comment on RULES_DIR) instead
          # of the production-only /etc/nginx/... path, which doesn't
          # exist on this runner.
          CRS_RULES_DIR: ${{ github.workspace }}/configs/nginx/modsec/coreruleset/rules
          # Avoids a wall of "Failed to create security audit log
          # directory /var/log/cybersentinel: [Errno 13] Permission
          # denied" noise in CI output — harmless (security.py already
          # fails soft on this), just cleaner logs.
          SECURITY_AUDIT_LOG_DIR: ${{ runner.temp }}/cybersentinel-audit-log
        run: pytest tests/ -v

  ml-waf:
    name: ML engine (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: ml-waf/requirements.txt

      - name: Install dependencies
        working-directory: ml-waf
        run: pip install -r requirements.txt

      - name: Run pytest
        working-directory: ml-waf
        run: pytest -v

  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Audit dependencies (npm audit)
        working-directory: frontend
        # --audit-level=high: block on High/Critical, same threshold pip-audit
        # and bandit's `-ll` use below — a Low/Moderate finding in some
        # transitive dev-tooling dependency shouldn't block every PR.
        run: npm audit --audit-level=high

      - name: Build
        working-directory: frontend
        run: npm run build

  security-scan:
    name: Security scanning (audit finding P2-10 — CI had none of this)
    runs-on: ubuntu-latest
    steps:
      # gitleaks needs real commit history to scan, not just the tip —
      # actions/checkout defaults to a 1-commit shallow clone.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install scanners
        # Pinned to match backend/requirements-dev.txt so a local run and
        # CI's run behave identically.
        run: pip install bandit==1.9.4 pip-audit==2.10.1

      - name: Dependency vulnerability scan (pip-audit)
        run: |
          pip-audit -r backend/requirements.txt
          pip-audit -r ml-waf/requirements.txt

      - name: Static analysis (bandit) — backend
        # Two invocations: clickhouse_service.py has B608 (SQL-injection
        # shaped f-strings) specifically skipped there, and only there —
        # every value bandit flags in that file is actually passed through
        # clickhouse-connect's %(name)s parameter binding one level down,
        # which bandit's static analysis can't see through. Verified by
        # hand, file-by-file, 2026-09-05 — see that file's own module
        # docstring before touching this. Every other file still gets the
        # full B608 check, same as bandit's default behavior.
        run: |
          bandit -r backend/app --exclude backend/app/services/clickhouse_service.py -ll -q
          bandit backend/app/services/clickhouse_service.py --skip B608 -ll -q

      - name: Static analysis (bandit) — ML engine
        run: bandit -r ml-waf -ll -q

      - name: Secret scanning (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-build:
    name: Docker build sanity check
    runs-on: ubuntu-latest
    needs: [backend, ml-waf, frontend]
    strategy:
      matrix:
        # openresty is intentionally excluded here: it compiles ModSecurity
        # and OpenResty from source via several git clones plus a live
        # GitHub-release download, making it a 10-20+ minute, network-flaky
        # build that's unrelated to typical app-code changes. Build/test it
        # manually (`docker compose build openresty`) when its Dockerfile
        # itself changes.
        service: [backend, frontend, ml-waf]
    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.service }} image
        run: docker build -t waf-${{ matrix.service }}:ci ./${{ matrix.service }}

      - name: Scan ${{ matrix.service }} image for OS/package CVEs (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        # Informational for now, not blocking — this is CI's first pass at
        # image scanning (audit finding P2-10) and hasn't had a real run
        # against these specific base images yet to know what it turns up.
        # Flip to failing once a first run has been reviewed.
        continue-on-error: true
        with:
          image-ref: "waf-${{ matrix.service }}:ci"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
