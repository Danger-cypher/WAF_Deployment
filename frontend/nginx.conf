server {

    listen 80;

    root /usr/share/nginx/html;

    index index.html;

    # Security headers for all static asset responses
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none';" always;

    location / {
        try_files $uri /index.html;
    }

    location /api/ {

        proxy_pass http://waf-backend:8000/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;

        proxy_set_header Upgrade $http_upgrade;

        proxy_set_header Connection "upgrade";

    }

    location /ws/ {

        proxy_pass http://waf-backend:8000/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;

        proxy_set_header Upgrade $http_upgrade;

        proxy_set_header Connection "Upgrade";

        # WebSocket connections are long-lived and often idle between events;
        # nginx's 60s default proxy_read_timeout would silently kill them.
        proxy_read_timeout 3600s;

        proxy_send_timeout 3600s;

    }

}
