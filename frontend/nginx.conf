server {

    listen 80;

    root /usr/share/nginx/html;

    index index.html;

    # Security response headers (X-Frame-Options, CSP, etc.) are deliberately
    # NOT set here. This container is only ever reached through the WAF
    # gateway's `location /` (configs/nginx/sites-available/cybersentinel),
    # which already applies the current, correct set from its own global
    # add_header block (configs/nginx/nginx.conf) to every response it
    # proxies from here. `add_header` appends rather than dedupes against a
    # header the upstream already set, so restating them here used to send
    # two Content-Security-Policy headers per response — browsers enforce
    # the *intersection* of every CSP header present, and this file's CSP
    # was missing the Google Fonts origins the gateway's policy carries
    # specifically to keep the dashboard's font stylesheet from being
    # blocked, silently defeating that fix (audit finding P2-05). Restore a
    # duplicate here only if this container is ever exposed on a path that
    # bypasses the gateway.

    # Vite's build output fingerprints every asset filename with a content
    # hash (index-BsEUC0Kc.css etc.) — a changed file gets a new name, so
    # these are safe to cache forever.
    location ~* ^/assets/.+\.(?:js|css|svg|png|jpg|jpeg|gif|ico|webp|woff2?|ttf|eot)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html references those hashed filenames, so it must never be
    # cached by the browser or an intermediate proxy — otherwise a stale
    # cached index.html keeps a client on an old deploy indefinitely even
    # though the server is already serving the fix (no explicit header here
    # previously meant nginx's defaults left this to browser/proxy
    # heuristics, e.g. RFC 7234 Last-Modified-based freshness).
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri /index.html;
    }

    location /api/ {

        proxy_pass http://waf-backend:8000/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;

        proxy_set_header Upgrade $http_upgrade;

        proxy_set_header Connection "upgrade";

    }

    location /ws/ {

        proxy_pass http://waf-backend:8000/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;

        proxy_set_header Upgrade $http_upgrade;

        proxy_set_header Connection "Upgrade";

        # WebSocket connections are long-lived and often idle between events;
        # nginx's 60s default proxy_read_timeout would silently kill them.
        proxy_read_timeout 3600s;

        proxy_send_timeout 3600s;

    }

}
