server {

    listen 80;

    root /usr/share/nginx/html;

    index index.html;

    # Security headers for all static asset responses
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none';" always;

    # Vite's build output fingerprints every asset filename with a content
    # hash (index-BsEUC0Kc.css etc.) — a changed file gets a new name, so
    # these are safe to cache forever. add_header does NOT inherit from the
    # server block once a location defines its own, so the security headers
    # above are restated here.
    location ~* ^/assets/.+\.(?:js|css|svg|png|jpg|jpeg|gif|ico|webp|woff2?|ttf|eot)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none';" always;
        try_files $uri =404;
    }

    # index.html references those hashed filenames, so it must never be
    # cached by the browser or an intermediate proxy — otherwise a stale
    # cached index.html keeps a client on an old deploy indefinitely even
    # though the server is already serving the fix (no explicit header here
    # previously meant nginx's defaults left this to browser/proxy
    # heuristics, e.g. RFC 7234 Last-Modified-based freshness).
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none';" always;
        try_files $uri /index.html;
    }

    location /api/ {

        proxy_pass http://waf-backend:8000/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;

        proxy_set_header Upgrade $http_upgrade;

        proxy_set_header Connection "upgrade";

    }

    location /ws/ {

        proxy_pass http://waf-backend:8000/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;

        proxy_set_header Upgrade $http_upgrade;

        proxy_set_header Connection "Upgrade";

        # WebSocket connections are long-lived and often idle between events;
        # nginx's 60s default proxy_read_timeout would silently kill them.
        proxy_read_timeout 3600s;

        proxy_send_timeout 3600s;

    }

}
